name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    
permissions:
  contents: read

jobs:
  auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run tests
        working-directory: ./backend/auth-service
        run: go test ./...

  guestbook-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run tests
        working-directory: ./backend/guestbook-service
        run: go test ./...