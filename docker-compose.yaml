services:
  auth-service:
    ports:
      - "8080:8080"
    build: ./backend/auth-service
    command: [./auth-service]
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy

  postgres-auth:
    image: "postgres:18"
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql
    env_file:
      - ./backend/auth-service/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-auth:
    image: "redis:latest"
    ports:
      - "6379:6379"
    env_file:
      - ./backend/auth-service/.env
    volumes:
      - redis_auth_data:/data
    
  guestbook-service:
    ports:
      - "8081:8081"
    build: ./backend/guestbook-service
    command: [./guestbook-service]
    env_file:
      - ./backend/guestbook-service/.env
    depends_on:
      postgres-guestbook:
        condition: service_healthy

  postgres-guestbook:
    image: "postgres:18"
    ports:
      - "5433:5432"
    volumes:
      - postgres_guestbook_data:/var/lib/postgresql
    env_file:
      - ./backend/guestbook-service/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guest_db"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres_auth_data:
  postgres_guestbook_data:
  redis_auth_data: